<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="620" rx="10" fill="#15171b"/>

  <!-- Stage 1 -->
  <g>
    <rect x="60" y="36" width="250" height="58" rx="8" fill="#22262c" stroke="#ffffff" stroke-width="1.3"/>
    <text x="185" y="54" text-anchor="middle" font-size="10" letter-spacing="1" fill="#b8bec6">STAGE 1</text>
    <text x="185" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Power-on reset</text>
  </g>
  <line x1="185" y1="94" x2="185" y2="122" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g>
    <rect x="60" y="128" width="250" height="58" rx="8" fill="#22262c" stroke="#ffffff" stroke-width="1.3"/>
    <text x="185" y="144" text-anchor="middle" font-size="10" letter-spacing="1" fill="#b8bec6">STAGE 2</text>
    <text x="185" y="161" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Pre-boot loader (PBL)</text>
    <text x="185" y="177" text-anchor="middle" font-size="11" fill="#b8bec6">RCW + PBI</text>
  </g>
  <line x1="185" y1="186" x2="185" y2="214" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g>
    <rect x="60" y="220" width="250" height="58" rx="8" fill="#22262c" stroke="#ffffff" stroke-width="1.3"/>
    <text x="185" y="236" text-anchor="middle" font-size="10" letter-spacing="1" fill="#b8bec6">STAGE 3</text>
    <text x="185" y="253" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">TF-A BL2</text>
    <text x="185" y="269" text-anchor="middle" font-size="11" fill="#b8bec6">operates from the OCRAM</text>
  </g>
  <line x1="185" y1="278" x2="185" y2="306" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <g>
    <rect x="60" y="312" width="250" height="58" rx="8" fill="#22262c" stroke="#ffffff" stroke-width="1.3"/>
    <text x="185" y="328" text-anchor="middle" font-size="10" letter-spacing="1" fill="#b8bec6">STAGE 4</text>
    <text x="185" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">TF-A BL31</text>
    <text x="185" y="361" text-anchor="middle" font-size="11" fill="#b8bec6">stays in the DDR memory</text>
  </g>
  <line x1="185" y1="370" x2="185" y2="398" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <g>
    <rect x="60" y="404" width="250" height="58" rx="8" fill="#22262c" stroke="#ffffff" stroke-width="1.3"/>
    <text x="185" y="422" text-anchor="middle" font-size="10" letter-spacing="1" fill="#b8bec6">STAGE 5</text>
    <text x="185" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">U-Boot</text>
  </g>
  <line x1="185" y1="462" x2="185" y2="490" stroke="#ffffff" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Stage 6 -->
  <g>
    <rect x="60" y="496" width="250" height="58" rx="8" fill="#22262c" stroke="#ffffff" stroke-width="1.3"/>
    <text x="185" y="514" text-anchor="middle" font-size="10" letter-spacing="1" fill="#b8bec6">STAGE 6</text>
    <text x="185" y="534" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Linux</text>
  </g>

  <!-- Boot device container -->
  <rect x="400" y="128" width="270" height="290" rx="10" fill="none" stroke="#ffffff" stroke-width="1.3"/>
  <text x="535" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Boot device</text>
  <text x="535" y="168" text-anchor="middle" font-size="11" fill="#b8bec6">QSPI NOR flash or eMMC</text>

  <rect x="418" y="180" width="234" height="42" rx="6" fill="#22262c" stroke="#ffffff" stroke-width="1.1"/>
  <text x="535" y="206" text-anchor="middle" font-size="12" fill="#ffffff">RCW + PBI + BL2</text>

  <rect x="418" y="234" width="234" height="42" rx="6" fill="#22262c" stroke="#ffffff" stroke-width="1.1"/>
  <text x="535" y="260" text-anchor="middle" font-size="12" fill="#ffffff">FIP: BL31 + U-Boot</text>

  <rect x="418" y="288" width="234" height="52" rx="6" fill="#22262c" stroke="#ffffff" stroke-width="1.1"/>
  <text x="535" y="310" text-anchor="middle" font-size="12" fill="#ffffff">FMan firmware</text>
  <text x="535" y="326" text-anchor="middle" font-size="12" fill="#ffffff">+ environment data</text>

  <rect x="418" y="352" width="234" height="52" rx="6" fill="#22262c" stroke="#ffffff" stroke-width="1.1"/>
  <text x="535" y="374" text-anchor="middle" font-size="12" fill="#ffffff">Device tree + kernel</text>
  <text x="535" y="390" text-anchor="middle" font-size="12" fill="#ffffff">+ recovery system</text>

  <!-- Read links -->
  <line x1="416" y1="201" x2="316" y2="163" stroke="#ffffff" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.8" marker-end="url(#arrow)"/>
  <text x="366" y="168" text-anchor="middle" font-size="10" fill="#b8bec6">The PBL reads this</text>

  <line x1="416" y1="255" x2="316" y2="251" stroke="#ffffff" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.8" marker-end="url(#arrow)"/>
  <text x="366" y="240" text-anchor="middle" font-size="10" fill="#b8bec6">BL2 reads this</text>

  <line x1="416" y1="314" x2="316" y2="424" stroke="#ffffff" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.8" marker-end="url(#arrow)"/>
  <line x1="416" y1="378" x2="316" y2="438" stroke="#ffffff" stroke-width="1.1" stroke-dasharray="5 4" opacity="0.8" marker-end="url(#arrow)"/>
  <text x="381" y="404" text-anchor="middle" font-size="10" fill="#b8bec6">U-Boot reads these</text>
</svg>
